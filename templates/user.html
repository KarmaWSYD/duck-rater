{% extends "layout.html" %}

{% block title %}User: {{ user.username }}{% endblock %}

{% block content %}
<h2>User: {{ user.username }}</h2>
<p>
  {{ user.username}} has {{ items | count }} ilmoitusta.
</p>
<h3>Ilmoitukset</h3>
<ul>
  {% for item in items %}
  <li><a href="/item/{{ item.id }}">{{ item.title }}</a></li>
  {% endfor %}
</ul>
{% endblock %}
