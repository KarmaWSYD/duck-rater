{% extends "layout.html" %}

{% block title %}New Duck{% endblock %}

{% block content %}

<body>
  <form action="/new-duck" method="post">
    <p>
      Title: <br />
      <input type="text" name="duck-name" />
    </p>
    <p>
      Image: <br />
      <input type="file" name="duck-image" accept=".png,.jpg" />
    </p>
    <p>
      Description: <br />
      <input type="text" name="duck-description" />
    </p>
    <input type="submit" value="New Duck" />
  </form>
</body>

{% endblock %}
