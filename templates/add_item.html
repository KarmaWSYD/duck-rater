{% extends "layout.html" %}

{% block title %}New Duck{% endblock %}

{% block content %}

<body>
  <form action="/new-duck" method="post" enctype="multipart/form-data">
    <p>
      Title: <br />
      <input type="text" name="duck-name" maxlength="50" />
    </p>
    <p>
      Image (Required): <br />
      <input type="file" name="duck-image" id="duck-image" accept=".png,.jpg" required />
    </p>
    <p>
      Description: <br />
      <input type="text" name="duck-description" rows="8" cols="60" maxlength="1000" />
    </p>
    <label for="category">Choose a category (Required):</label>

    <p>
      <select name="category" id="category" required>
        {% for category in categories %}
        <option value="{{ category.id }}">{{ category.name }}: {{ category.description }}</option>
        {% endfor %}
      </select>
    </p>
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
    <input type="submit" value="Create a new Duck" />
  </form>
</body>


{% endblock %}
