{% extends "layout.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<body>
  <form action="/login" method="post">
    <p>
      Username: <br />
      <input type="text" name="username" maxlength="20" required />
    </p>
    <p>
      Password: <br />
      <input type="password" name="password" maxlength="36" required />
    </p>
    <input type="submit" value="Login" />
  </form>
</body>
{% endblock %}
